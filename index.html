<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Soccer Game - FIFA/EA Sports FC Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            width: 100%;
            height: 100vh;
            position: relative;
            background: #000;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ===== UI Overlay ===== */
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            font-family: 'Courier New', monospace;
            color: #fff;
            z-index: 5;
        }

        /* Score Display */
        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 40px;
            border-radius: 10px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
            border: 2px solid #ffed4e;
        }

        #matchTime {
            font-size: 24px;
            margin-top: 8px;
            color: #ffed4e;
        }

        /* Team Scores */
        .teamScore {
            display: inline-block;
            margin: 0 20px;
        }

        .teamName {
            font-size: 14px;
            opacity: 0.8;
        }

        .score {
            font-size: 36px;
            color: #ffed4e;
            font-weight: bold;
        }

        /* Top Left Info */
        #playerInfo {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            border: 2px solid #ffed4e;
        }

        #playerInfo div {
            margin: 5px 0;
        }

        .stat-label {
            display: inline-block;
            width: 70px;
            color: #aaa;
        }

        .stat-value {
            color: #ffed4e;
            font-weight: bold;
        }

        /* Stamina Bar */
        #staminaBar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            width: 250px;
            z-index: 10;
            border: 2px solid #ffed4e;
        }

        .bar-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .bar-container {
            background: #333;
            height: 20px;
            border-radius: 4px;
            overflow: hidden;
            border: 2px solid #555;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #ffed4e);
            width: 100%;
            transition: width 0.1s;
        }

        /* Game State */
        #gameState {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #ffed4e;
            display: none;
            z-index: 20;
            border: 3px solid #ffed4e;
        }

        /* Controls Display */
        #controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.8;
            z-index: 10;
            max-width: 250px;
            border: 2px solid #ffed4e;
        }

        .control-item {
            margin: 5px 0;
        }

        .key {
            background: #ffed4e;
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            display: inline-block;
            min-width: 25px;
            text-align: center;
        }

        /* Possession Indicator */
        #possessionIndicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 10;
            border: 2px solid #ffed4e;
        }

        .possession-team {
            font-size: 18px;
            font-weight: bold;
            color: #ffed4e;
            margin-top: 8px;
        }

        /* Error Display */
        #errorDisplay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.9);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            display: none;
            z-index: 100;
            border: 3px solid #ff0000;
            max-width: 500px;
            line-height: 1.8;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .pulse {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="canvas"></canvas>
        
        <div id="errorDisplay"></div>
        
        <div id="uiOverlay">
            <!-- Score Board -->
            <div id="scoreBoard">
                <div style="display: flex; justify-content: center; align-items: center;">
                    <div class="teamScore">
                        <div class="teamName">Team A</div>
                        <div class="score" id="scoreTeamA">0</div>
                    </div>
                    <div style="font-size: 20px; color: #aaa;">VS</div>
                    <div class="teamScore">
                        <div class="teamName">Team B</div>
                        <div class="score" id="scoreTeamB">0</div>
                    </div>
                </div>
                <div id="matchTime">00:00</div>
            </div>

            <!-- Player Info -->
            <div id="playerInfo">
                <div><span class="stat-label">Player:</span> <span class="stat-value" id="playerNum">-</span></div>
                <div><span class="stat-label">Team:</span> <span class="stat-value" id="playerTeam">-</span></div>
                <div><span class="stat-label">Speed:</span> <span class="stat-value" id="playerSpeed">0.0</span> m/s</div>
                <div><span class="stat-label">Status:</span> <span class="stat-value" id="playerStatus">Ready</span></div>
            </div>

            <!-- Stamina Bar -->
            <div id="staminaBar">
                <div class="bar-label">STAMINA</div>
                <div class="bar-container">
                    <div class="bar-fill" id="staminaFill"></div>
                </div>
            </div>

            <!-- Game State Display -->
            <div id="gameState"></div>

            <!-- Possession Indicator -->
            <div id="possessionIndicator">
                <div style="color: #aaa;">POSSESSION:</div>
                <div class="possession-team" id="possessionTeam">-</div>
            </div>

            <!-- Controls -->
            <div id="controls">
                <div style="color: #ffed4e; font-weight: bold; margin-bottom: 10px;">CONTROLS</div>
                <div class="control-item"><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> - Move</div>
                <div class="control-item"><span class="key">SHIFT</span> - Sprint</div>
                <div class="control-item"><span class="key">SPACE</span> - Pass</div>
                <div class="control-item"><span class="key">CTRL</span> - Shoot</div>
                <div class="control-item"><span class="key">P</span> - Pause/Resume</div>
                <div class="control-item"><span class="key">R</span> - Restart</div>
            </div>
        </div>
    </div>

    <!-- Three.js Library (with fallback) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Check if Three.js loaded
        if (typeof THREE === 'undefined') {
            document.getElementById('errorDisplay').style.display = 'block';
            document.getElementById('errorDisplay').innerHTML = '❌ Error: Three.js failed to load<br/>Please check your internet connection or try a different browser';
        }
    </script>
    
    <!-- Complete Game Script - ALL IN ONE -->
    <script src="files/Scripts/FullGame.js"></script>
    
    <!-- Error Handling -->
    <script>
        window.addEventListener('error', (event) => {
            console.error('Script Error:', event.error);
            document.getElementById('errorDisplay').style.display = 'block';
            document.getElementById('errorDisplay').innerHTML = '❌ Error Loading Game:<br/>' + event.error.message + '<br/><br/>Check console for details';
        });
    </script>
</body>
</html>
